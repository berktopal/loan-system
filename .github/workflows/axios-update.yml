name: axios security update (temporary)
on:
  push:
    branches: [fix/axios-security]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - name: Update axios to latest
        run: npm install axios@latest --save
      - name: Audit (fail on high)
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Update axios to $(node -p "require('./node_modules/axios/package.json').version") (fixes 12 Dependabot alerts)" || echo "nothing to commit"
          git push
