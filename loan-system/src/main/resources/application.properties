server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/loan_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Kredi personeli hesabı (koda gömülü şifre yok). ADMIN_PASSWORD verilmezse
# her açılışta rastgele şifre üretilir ve loga yazılır.
app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:}

# API'ye tarayıcıdan erişebilecek frontend adres(ler)i, virgülle ayrılır
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
